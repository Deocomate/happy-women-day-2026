<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Không tìm thấy</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, sans-serif; text-align: center;
      background: radial-gradient(circle at 50% 30%, #3b1530, #14070f 70%); color: #f7e7ee;
    }
    .flower { font-size: 56px; animation: sway 3s ease-in-out infinite; display: inline-block; }
    h1 { font-weight: 600; font-size: 1.4rem; margin: 16px 0 8px; }
    p { margin: 0; opacity: .7; }
    @keyframes sway { 50% { transform: rotate(8deg); } }
  </style>
</head>
<body>
  <main>
    <span class="flower" aria-hidden="true">🥀</span>
    <h1>Ơ, món quà này không có ở đây</h1>
    <p>Có thể link bị gõ nhầm, hoặc người gửi đã cất nó đi rồi.</p>
  </main>
</body>
</html>
