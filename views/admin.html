<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị · Vườn hoa 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body data-base="{{BASE}}">
  <header class="topbar">
    <div class="brand brand-inline">
      <span class="brand-mark" aria-hidden="true">✿</span>
      <strong>Vườn hoa 20/10</strong>
    </div>
    <form method="post" action="{{BASE}}/logout">
      <button type="submit" class="btn btn-ghost">Đăng xuất</button>
    </form>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="create-title">
      <h2 id="create-title">Tặng hoa cho một người</h2>
      <form id="create-form" class="create-form" novalidate>
        <label class="avatar-picker" for="avatar-input">
          <input id="avatar-input" class="sr-only" type="file" accept="image/*">
          <span class="avatar-preview" id="avatar-preview" aria-hidden="true">
            <span class="avatar-placeholder">＋</span>
          </span>
          <span class="avatar-hint">
            <strong>Ảnh đại diện</strong>
            <small>Chạm để chọn ảnh · tự cắt vuông</small>
          </span>
        </label>
        <button type="button" id="avatar-clear" class="btn btn-ghost btn-small" hidden>Bỏ ảnh</button>

        <label class="field">
          <span>Tên người nhận</span>
          <input id="name-input" name="name" type="text" maxlength="80" placeholder="VD: Nguyễn Thị Hoa" required>
        </label>
        <p class="slug-preview">Đường dẫn: <code id="slug-preview">/…</code></p>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="create-btn">Tạo đường dẫn tặng hoa 💐</button>
      </form>

      <div id="created" class="created" hidden>
        <p>Đã tạo! Gửi đường dẫn này cho <strong id="created-name"></strong>:</p>
        <div class="link-row">
          <input id="created-link" type="text" readonly>
          <button type="button" class="btn btn-primary btn-small" data-copy-target="created-link">Sao chép</button>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="panel-head">
        <h2 id="list-title">Danh sách đã tặng</h2>
        <span id="count" class="badge">0</span>
      </div>
      <p id="empty" class="empty" hidden>Chưa có ai. Hãy tặng bó hoa đầu tiên nhé!</p>
      <ul id="list" class="list"></ul>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/admin/admin.js" type="module"></script>
</body>
</html>
